name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, detekt, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Build (compile, detekt, tests on embedded PostgreSQL)
        run: ./gradlew build
      - name: Deploy parts lint
        run: bash tools/deploy-lint.sh

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI in its own container: the whole git history, findings redacted, no licence needed.
      - name: gitleaks (git history)
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo zricethezav/gitleaks:v8.24.0
          detect --source . --redact --verbose

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Skip without an NVD API key
        if: env.NVD_API_KEY == ''
        run: echo "::notice::NVD_API_KEY secret is not set; the OWASP dependency scan was skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NVD_API_KEY != ''
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: env.NVD_API_KEY != ''
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        if: env.NVD_API_KEY != ''
      - name: Cache the NVD database
        if: env.NVD_API_KEY != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: OWASP dependency-check (fails on CVSS >= 9)
        if: env.NVD_API_KEY != ''
        run: ./gradlew dependencyCheckAnalyze --no-configuration-cache

  image:
    name: Image to ghcr.io
    if: github.event_name == 'push'
    needs: [build, gitleaks, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name and version
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/cmpose-app"
          tags="${image}:${short_sha}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9A-Za-z._-]{1,120}$ ]]; then
              echo "::error::Tag is not a valid image tag"
              exit 1
            fi
            version="${GITHUB_REF_NAME}"
            tags="${tags},${image}:${GITHUB_REF_NAME}"
          else
            version="${short_sha}"
            tags="${tags},${image}:latest"
          fi
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "IMAGE_TAGS=${tags}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          tags: ${{ env.IMAGE_TAGS }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
