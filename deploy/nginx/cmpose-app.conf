# cmpose-app behind the shared nginx: copied to /etc/nginx/apps/ and included inside the main server block, which owns
# TLS and HSTS. The app itself only sees /api/v1/..., /health and /ready, so the /cmpose-app/ prefix is stripped.
#
# The upstream is a variable resolved through Docker's DNS (127.0.0.11), so nginx starts and reloads while the
# container is down (that location answers 502 until it is back). With a variable proxy_pass nginx does not replace
# the prefix itself; the rewrite does.
location /cmpose-app/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $cmpose_app_upstream http://cmpose-app:8080;
    rewrite ^/cmpose-app/(.*)$ /$1 break;
    proxy_pass $cmpose_app_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwritten, not appended: the app trusts this header only from the Docker network (TRUSTED_PROXIES).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # MAX_UPLOAD_BYTES (10 MB) plus multipart overhead; the app enforces the exact limits.
    client_max_body_size 11m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
